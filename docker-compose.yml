services:
  db:
    image: postgres:16
    container_name: kasirku-db
    restart: always
    environment:
      POSTGRES_USER: kasirku
      POSTGRES_PASSWORD: rahasia
      POSTGRES_DB: kasirku
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  